<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Favicon Lab — planet concepts</title>
<link id="live-favicon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%224%22 fill=%22%233C49FF%22/></svg>" />
<style>
  :root {
    --accent: #3C49FF;
    --accent-mid: #8D94FF;
    --bg: #0a0b14;
    --card: #14162a;
    --card-2: #1c1f3a;
    --text: #e9ebff;
    --muted: #8389b5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
  body { padding: 32px; }
  header { max-width: 1200px; margin: 0 auto 24px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  p.lede { margin: 0; color: var(--muted); font-size: 13px; }
  .grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; border: 1px solid rgba(255,255,255,0.04); }
  .stage {
    background: radial-gradient(circle at 50% 50%, #1a1d3a 0%, #0a0b14 70%);
    border-radius: 10px;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .stage canvas.big { width: 75%; height: 75%; image-rendering: pixelated; }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .name { font-size: 13px; font-weight: 600; }
  .desc { color: var(--muted); font-size: 11px; margin-top: 2px; line-height: 1.4; }
  .sizes { display: flex; gap: 14px; align-items: center; padding: 8px 10px; background: var(--card-2); border-radius: 8px; }
  .sizes .row { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sizes label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .sizes canvas { background: #0a0b14; border-radius: 3px; }
  button.apply {
    border: 0; background: var(--accent); color: white; padding: 8px 12px; font-size: 12px;
    border-radius: 8px; cursor: pointer; font-weight: 600; transition: background .15s;
  }
  button.apply:hover { background: #2a36e8; }
  button.apply.active { background: var(--accent-mid); color: #14162a; }
  .now { position: fixed; bottom: 20px; right: 20px; background: var(--card); padding: 10px 14px; border-radius: 999px; font-size: 12px; color: var(--muted); border: 1px solid rgba(255,255,255,0.06); }
  .now strong { color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>Favicon lab — planet concepts</h1>
  <p class="lede">Click <em>Set as tab icon</em> on any concept to see it live in the browser tab. The two small canvases on each card are the actual 32px / 16px renders.</p>
</header>

<div class="grid" id="grid"></div>

<div class="now">Tab icon: <strong id="active-name">default</strong></div>

<script>
/* ---------- shared helpers ---------- */
const ACCENT = '#3C49FF';
const ACCENT_MID = '#8D94FF';
const ACCENT_SOFT = '#c8ccff';
const STAR = '#ffffff';

function clear(ctx, size, bg) {
  ctx.clearRect(0, 0, size, size);
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, size, size); }
}

/* ---------- concept renderers ----------
   Each takes (ctx, size, t) where t is seconds since start.
   They render onto a `size x size` canvas with transparent bg
   (favicon backgrounds are transparent in browser tabs). */

const concepts = [
  {
    id: 'saturn',
    name: 'Saturn halo',
    desc: 'Planet body with a tilted ring rotating around it.',
    render(ctx, size, t) {
      clear(ctx, size);
      const cx = size/2, cy = size/2;
      const r = size * 0.22;

      // ring back half
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.35);
      ctx.scale(1, 0.28);
      ctx.lineWidth = Math.max(1.2, size*0.04);
      ctx.strokeStyle = ACCENT_MID;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      const rotPhase = t * 1.2;
      // back half: angles where ring is "behind" the planet
      ctx.arc(0, 0, size*0.36, Math.PI + rotPhase, Math.PI*2 + rotPhase);
      ctx.stroke();
      ctx.restore();

      // planet body
      const grad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
      grad.addColorStop(0, ACCENT_MID);
      grad.addColorStop(1, ACCENT);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fill();

      // ring front half
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.35);
      ctx.scale(1, 0.28);
      ctx.lineWidth = Math.max(1.2, size*0.04);
      ctx.strokeStyle = ACCENT_MID;
      ctx.globalAlpha = 0.95;
      ctx.beginPath();
      ctx.arc(0, 0, size*0.36, rotPhase, Math.PI + rotPhase);
      ctx.stroke();
      ctx.restore();
    }
  },
  {
    id: 'orbit',
    name: 'Orbiting moon',
    desc: 'A small moon circles a still planet.',
    render(ctx, size, t) {
      clear(ctx, size);
      const cx = size/2, cy = size/2;
      const r = size * 0.24;

      // faint orbit path
      ctx.strokeStyle = ACCENT_MID;
      ctx.globalAlpha = 0.25;
      ctx.lineWidth = Math.max(1, size*0.025);
      ctx.beginPath();
      ctx.arc(cx, cy, size*0.38, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // planet
      const grad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
      grad.addColorStop(0, ACCENT_MID);
      grad.addColorStop(1, ACCENT);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fill();

      // moon
      const a = t * 1.4;
      const mx = cx + Math.cos(a) * size*0.38;
      const my = cy + Math.sin(a) * size*0.38;
      const moonR = Math.max(1.5, size*0.07);
      ctx.fillStyle = ACCENT_SOFT;
      ctx.beginPath();
      ctx.arc(mx, my, moonR, 0, Math.PI*2);
      ctx.fill();
    }
  },
  {
    id: 'rotating',
    name: 'Rotating planet',
    desc: 'Banded sphere — bands shift to suggest rotation.',
    render(ctx, size, t) {
      clear(ctx, size);
      const cx = size/2, cy = size/2;
      const r = size * 0.36;

      // clip to circle
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.clip();

      // base
      ctx.fillStyle = ACCENT;
      ctx.fillRect(cx-r, cy-r, r*2, r*2);

      // bands moving horizontally
      const shift = (t * 30) % (r*2);
      ctx.fillStyle = ACCENT_MID;
      for (let i = -2; i < 6; i++) {
        const y = cy - r + (i * r*0.5) + shift;
        ctx.fillRect(cx-r, y, r*2, r*0.16);
      }

      // soft highlight
      const hl = ctx.createRadialGradient(cx - r*0.4, cy - r*0.4, 1, cx - r*0.4, cy - r*0.4, r);
      hl.addColorStop(0, 'rgba(255,255,255,0.35)');
      hl.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hl;
      ctx.fillRect(cx-r, cy-r, r*2, r*2);

      ctx.restore();
    }
  },
  {
    id: 'universe',
    name: 'Mini universe',
    desc: 'Central star with two planets on different orbits.',
    render(ctx, size, t) {
      clear(ctx, size);
      const cx = size/2, cy = size/2;

      // background stars (twinkle)
      const stars = [
        [0.15, 0.2, 0.8], [0.85, 0.25, 1.2], [0.2, 0.8, 1.5],
        [0.78, 0.78, 0.6], [0.5, 0.12, 1.0]
      ];
      ctx.fillStyle = STAR;
      stars.forEach(([sx, sy, ph]) => {
        const tw = 0.4 + 0.6 * (0.5 + 0.5*Math.sin(t*2 + ph*5));
        ctx.globalAlpha = tw * 0.7;
        ctx.fillRect(sx*size, sy*size, Math.max(1, size*0.04), Math.max(1, size*0.04));
      });
      ctx.globalAlpha = 1;

      // central star
      const sr = size*0.1;
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, sr*3);
      glow.addColorStop(0, ACCENT_MID);
      glow.addColorStop(0.5, 'rgba(141,148,255,0.2)');
      glow.addColorStop(1, 'rgba(141,148,255,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0,0,size,size);
      ctx.fillStyle = STAR;
      ctx.beginPath();
      ctx.arc(cx, cy, sr, 0, Math.PI*2);
      ctx.fill();

      // planet 1 (inner)
      const a1 = t * 1.6;
      const r1 = size*0.22;
      ctx.fillStyle = ACCENT_MID;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a1)*r1, cy + Math.sin(a1)*r1, Math.max(1.5, size*0.06), 0, Math.PI*2);
      ctx.fill();

      // planet 2 (outer, opposite direction)
      const a2 = -t * 0.9 + 1;
      const r2 = size*0.38;
      ctx.fillStyle = ACCENT;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a2)*r2, cy + Math.sin(a2)*r2, Math.max(1.5, size*0.08), 0, Math.PI*2);
      ctx.fill();
    }
  },
  {
    id: 'eclipse',
    name: 'Eclipse',
    desc: 'A dark moon slowly drifts across a glowing planet.',
    render(ctx, size, t) {
      clear(ctx, size);
      const cx = size/2, cy = size/2;
      const r = size * 0.3;

      // glow halo
      const halo = ctx.createRadialGradient(cx, cy, r*0.9, cx, cy, r*1.8);
      halo.addColorStop(0, 'rgba(141,148,255,0.55)');
      halo.addColorStop(1, 'rgba(141,148,255,0)');
      ctx.fillStyle = halo;
      ctx.fillRect(0,0,size,size);

      // planet
      const grad = ctx.createRadialGradient(cx - r*0.2, cy - r*0.2, r*0.1, cx, cy, r);
      grad.addColorStop(0, ACCENT_MID);
      grad.addColorStop(1, ACCENT);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fill();

      // moon drifts left -> right, loops
      const period = 5;
      const phase = (t % period) / period; // 0..1
      const mx = cx - r*2 + phase * r*4;
      ctx.fillStyle = '#0a0b14';
      ctx.beginPath();
      ctx.arc(mx, cy, r*0.85, 0, Math.PI*2);
      ctx.fill();
    }
  }
];

/* ---------- card construction ---------- */
const grid = document.getElementById('grid');
const liveLink = document.getElementById('live-favicon');
const activeNameEl = document.getElementById('active-name');
let activeConcept = null;

concepts.forEach(c => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="stage"><canvas class="big" width="128" height="128"></canvas></div>
    <div>
      <div class="name">${c.name}</div>
      <div class="desc">${c.desc}</div>
    </div>
    <div class="meta">
      <div class="sizes">
        <div class="row"><canvas width="32" height="32" style="width:32px;height:32px"></canvas><label>32</label></div>
        <div class="row"><canvas width="16" height="16" style="width:16px;height:16px"></canvas><label>16</label></div>
      </div>
      <button class="apply" data-id="${c.id}">Set as tab icon</button>
    </div>
  `;
  grid.appendChild(card);
  c.canvases = card.querySelectorAll('canvas');
});

/* ---------- animation loop ---------- */
const start = performance.now();
let lastFaviconUpdate = 0;

function tick(now) {
  const t = (now - start) / 1000;
  concepts.forEach(c => {
    c.canvases.forEach(cv => {
      const ctx = cv.getContext('2d');
      c.render(ctx, cv.width, t);
    });
  });

  // throttle favicon update to ~12fps to keep it cheap
  if (activeConcept && now - lastFaviconUpdate > 80) {
    lastFaviconUpdate = now;
    // use the 32px canvas as the favicon source
    const src = activeConcept.canvases[1]; // index 1 = 32px
    liveLink.href = src.toDataURL('image/png');
  }

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- apply buttons ---------- */
grid.addEventListener('click', e => {
  const btn = e.target.closest('button.apply');
  if (!btn) return;
  const c = concepts.find(x => x.id === btn.dataset.id);
  activeConcept = c;
  activeNameEl.textContent = c.name;
  document.querySelectorAll('button.apply').forEach(b => b.classList.toggle('active', b === btn));
});
</script>
</body>
</html>
